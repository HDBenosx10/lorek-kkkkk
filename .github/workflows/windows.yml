name: HubSpot Lotes - Windows
on:
  push:
    branches: [main]
    tags: ['hubspot-lotes-v*']
    paths: ['tools/hubspot-lotes/**', 'scripts/package-windows.py', '.github/workflows/windows.yml']
  pull_request:
    paths: ['tools/hubspot-lotes/**', 'scripts/package-windows.py', '.github/workflows/windows.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: publish assets to hubspot-lotes-vX.Y.Z (must match VERSION)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag || '' }}
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pinned dependencies
        run: python -m pip install -r tools/hubspot-lotes/requirements.txt
      - name: Ensure Edge browser
        run: python -m playwright install msedge
      - name: Test with local forms and intercepted submissions
        run: python -m unittest discover -s tools/hubspot-lotes -p test_app.py -v
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --onefile --windowed --collect-all playwright --name HubSpotLotes --distpath dist/windows --workpath build/windows --specpath build tools/hubspot-lotes/app.py
      - name: Test packaged interface and browser
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/windows/HubSpotLotes.exe).Path
          $proof = Join-Path $env:RUNNER_TEMP 'packaged-smoke.json'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test', $proof -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Packaged app timed out' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $proof)) { throw 'Packaged app failed' }
          $result = Get-Content $proof -Raw | ConvertFrom-Json
          if ($result.interface -ne 'ok' -or $result.config_tab -ne 'ok' -or $result.browser -ne 'ok' -or $result.external_requests -ne 0) { throw 'Invalid smoke result' }
          Get-Content $proof
      - name: Package and validate version
        run: python scripts/package-windows.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hubspot-lotes-windows-x64
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 30
  release:
    needs: build
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/hubspot-lotes-v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hubspot-lotes-windows-x64
          path: package
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha 2>/dev/null || true)
          if [ -n "$tag_commit" ] && [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo 'Release tag points to a different commit; publish a new version instead.'
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "HubSpot Lotes ${RELEASE_TAG#hubspot-lotes-v}" --notes-file package/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" package/HubSpotLotes.exe package/HubSpotLotes-Cliente-Windows.zip package/SHA256SUMS.txt --clobber

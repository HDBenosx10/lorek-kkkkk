name: Portfolio - Cloudflare Pages
on:
  push:
    branches: [main]
    paths: ['*.html', '*.css', '*.js', 'scripts/site.mjs', '.github/workflows/pages.yml']
  pull_request:
    paths: ['*.html', '*.css', '*.js', 'scripts/site.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate and stage public files
        run: node scripts/site.mjs
      - name: Deploy production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.146.0'
          command: pages deploy dist/site --project-name portifolio-leonardo-lagoa --branch main
      - name: Verify published site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/site.mjs verify https://portifolio-leonardo-lagoa.pages.dev
